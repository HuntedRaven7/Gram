name: Secure Boot unlock
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secureboot-unlock:
    name: secureboot-unlock
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ISO with headless config
        uses: $/.github/actions/build-iso
        with:
          ci-config: tests/ci-install.json
      - name: Install QEMU, OVMF, swtpm, and guestfish
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf swtpm libguestfs-tools python3
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install target and boot it
        run: ./scripts/vm-install-test.sh
      - name: Provision Secure Boot fixtures
        env:
          FIXTURE_BASE_URL: ${{ vars.SECUREBOOT_FIXTURE_BASE_URL }}
          FIXTURE_DIR: /tmp/gram-secureboot-fixtures
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE_DIR"
          if [ -z "$FIXTURE_BASE_URL" ]; then
            echo "NOTICE: SECUREBOOT_FIXTURE_BASE_URL is not configured."
            echo "The harness will report the blocked state and write it to both logs."
            echo "See docs/secureboot-swtpm.md for the image-side TODO."
            exit 0
          fi
          for fixture in OVMF_VARS.enrolled.fd uki-signed.efi uki-unknown.efi; do
            curl -fsSL "$FIXTURE_BASE_URL/$fixture" -o "$FIXTURE_DIR/$fixture"
          done
      - name: Run signed and unknown-key unlock cases
        env:
          DISK: /tmp/gram-install-test.qcow2
          FIXTURE_DIR: /tmp/gram-secureboot-fixtures
          LOG_SIGNED: /tmp/gram-secureboot-signed.log
          LOG_UNKNOWN: /tmp/gram-secureboot-unknown.log
        run: ./scripts/secureboot-swtpm-test.sh
      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secureboot-serial-logs
          path: |
            /tmp/gram-secureboot-signed.log
            /tmp/gram-secureboot-unknown.log
          if-no-files-found: warn
